# Builds the API image (Dockerfile.api) for linux/amd64 and pushes it to GitHub Container Registry as
# ghcr.io/akankshab17/interview-brief-api:<git sha> and :latest. Uses only the workflow's GITHUB_TOKEN.
# Azure Container Apps pulls a specific :<sha> tag (deploy/azure), so pushing an image never changes what runs.
name: API image

on:
  push:
    branches: [web-ui, main]
    paths:
      - Dockerfile.api
      - .dockerignore
      - requirements.txt
      - src/**
      - .github/workflows/image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/akankshab17/interview-brief-api:${{ github.sha }}
            ghcr.io/akankshab17/interview-brief-api:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
